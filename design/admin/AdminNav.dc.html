<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>القائمة الجانبية</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&amp;family=Jost:wght@300;400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
[dir="ltr"]{font-family:'Jost','IBM Plex Sans Arabic',sans-serif}
a{color:#111111;text-decoration:none}a:hover{color:#111111}
</style>
</helmet>
<nav dir="rtl" aria-label="القائمة الرئيسية" style="width: 100%; min-height: 100%; height: 100%; box-sizing: border-box; background: #FFFFFF; border-left: 1px solid #E6E4E0; font-family: 'IBM Plex Sans Arabic', system-ui, sans-serif; color: #111111; display: flex; flex-direction: column; padding: 24px 16px; gap: 4px">
<div style="display: flex; align-items: center; gap: 10px; padding: 0 8px 20px">
<div style="display: flex; flex-direction: column; align-items: flex-start; gap: 2px"><img src="/_blob/4715b420fbf7b743c5b3fe8ef06de73a" alt="ميكاسا" style="width: 170px; height: 85px; object-fit: cover; object-position: center; mix-blend-mode: multiply; display: block"><span style="font-size: 12px; color: #5F5B55; letter-spacing: 1px">لوحة الإدارة</span></div>
</div>
<sc-for list="{{items}}" as="it" hint-placeholder-count="9">
<a href="{{it.href}}" style="{{it.style}}">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{it.d}}"></path></svg>
<span style="flex-grow: 1">{{it.label}}</span>
<sc-if value="{{it.hasBadge}}" hint-placeholder-val="{{ false }}"><span style="min-width: 22px; height: 22px; border-radius: 11px; background: #B42318; color: #FFFFFF; font-size: 12px; font-weight: 700; display: flex; align-items: center; justify-content: center">{{it.badge}}</span></sc-if>
</a>
</sc-for>
<div style="flex-grow: 1; min-height: 24px"></div>
<a href="AdminAI.dc.html" style="display: flex; align-items: center; gap: 10px; height: 48px; padding: 0 14px; border-radius: 12px; background: #111111; color: #FFFFFF; font-size: 15px; font-weight: 600">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"></rect><path d="M5 11a7 7 0 0 0 14 0M12 18v3"></path></svg>
اسأل المساعد
</a>
<div style="display: flex; align-items: center; gap: 10px; padding: 14px 8px 0">
<span style="width: 36px; height: 36px; border-radius: 18px; background: #F1F0EE; color: #111111; font-weight: 700; display: flex; align-items: center; justify-content: center">ع</span>
<div style="display: flex; flex-direction: column"><span style="font-size: 14px; font-weight: 600">عدنان</span><span style="font-size: 12px; color: #5F5B55">المدير</span></div>
</div>
</nav>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"active":{"editor":"enum","options":["overview","stock","orders","counts","factory","raw","waste","staff","settings"],"default":"overview"},"$preview":{"width":260,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const active = this.props.active ?? 'overview';
    const list = [
      ['overview', 'نظرة عامة', 'AdminOverview.dc.html', 'M4 13h6V4H4zM14 20h6v-9h-6zM4 20h6v-3H4zM14 7h6V4h-6z', 0],
      ['stock', 'الستوك والاستهلاك', 'AdminStock.dc.html', 'M3 7l9-4 9 4-9 4zM3 12l9 4 9-4M3 17l9 4 9-4', 0],
      ['orders', 'الطلب والإخراج', 'AdminOrders.dc.html', 'M3 7h11v9H3zM14 10h4l3 3v3h-7M7 18a2 2 0 1 0 0 .01M17 18a2 2 0 1 0 0 .01', 2],
      ['counts', 'الجرودات', 'AdminCounts.dc.html', 'M6 4h12v17H6zM9 9h6M9 13h6M9 17h3', 1],
      ['factory', 'المصنع والدفعات', 'AdminFactory.dc.html', 'M3 21V9l6 4V9l6 4V5h6v16z', 0],
      ['raw', 'المواد الأولية', 'AdminRaw.dc.html', 'M6 8h12l-1 12H7zM9 8V5h6v3', 2],
      ['waste', 'التالف', 'AdminWaste.dc.html', 'M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3', 0],
      ['staff', 'الموظفين والأدوار', 'AdminStaff.dc.html', 'M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM2 21v-1a6 6 0 0 1 12 0v1M17 11a3 3 0 1 0 0-6M22 21v-1a5 5 0 0 0-3-4.6', 0],
      ['settings', 'الإعدادات', 'AdminSettings.dc.html', 'M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6zM19 12h2M3 12h2M12 3v2M12 19v2M17 7l1.5-1.5M5.5 18.5L7 17M17 17l1.5 1.5M5.5 5.5L7 7', 0]
    ];
    const items = list.map((x) => ({
      label: x[1], href: x[2], d: x[3], badge: x[4], hasBadge: x[4] > 0,
      style: 'display: flex; align-items: center; gap: 10px; height: 44px; padding: 0 12px; border-radius: 10px; font-size: 15px; ' + (x[0] === active ? 'background: #F1F0EE; color: #111111; font-weight: 600' : 'color: #3F3C38')
    }));
    return { items };
  }
}
</script>
</body>
</html>
