<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>جرد ستوك المصنع</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&amp;family=Jost:wght@300;400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
[dir="ltr"]{font-family:'Jost','IBM Plex Sans Arabic',sans-serif}
a{color:#111111;text-decoration:none}a:hover{color:#111111}
</style>
</helmet>
<div dir="rtl" style="width: 390px; height: 1100px; box-sizing: border-box; background: #FAFAF8; font-family: 'IBM Plex Sans Arabic', system-ui, sans-serif; color: #111111; display: flex; flex-direction: column">

<div style="padding: 16px 20px 12px; display: flex; flex-direction: column; gap: 10px; border-bottom: 1px solid #E6E4E0">
<header style="display: flex; align-items: center; gap: 8px">
<a href="FactoryHome.dc.html" aria-label="رجوع" style="width: 48px; height: 48px; border-radius: 24px; display: flex; align-items: center; justify-content: center; background: #FFFFFF; border: 1px solid #E6E4E0"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#111111" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg></a>
<div style="display: flex; flex-direction: column">
<h1 style="margin: 0; font-size: 22px; font-weight: 700">جرد ستوك المصنع</h1>
<span style="font-size: 14px; color: #5F5B55">عدّ كل رقم لحاله</span>
</div>
</header>
<span style="font-size: 13px; color: #5F5B55; line-height: 1.6">ما بنعرض الكمية المتوقعة مشان العد يكون حقيقي. الفرق بيطلع للمدير بعد التأكيد.</span>
</div>

<div style="flex-grow: 1; overflow-y: auto; padding: 12px 20px; display: flex; flex-direction: column; gap: 10px">
<sc-for list="{{items}}" as="it" hint-placeholder-count="6">
<div style="display: flex; flex-direction: column; gap: 10px; padding: 14px; border-radius: 16px; background: #FFFFFF; border: 1px solid #E6E4E0">
<div style="display: flex; align-items: center; justify-content: space-between">
<span dir="ltr" style="font-size: 17px; font-weight: 600">{{it.name}}</span>
<span style="font-size: 13px; color: #5F5B55">{{it.total}}</span>
</div>
<sc-for list="{{it.rows}}" as="r" hint-placeholder-count="2">
<div style="display: flex; align-items: center; gap: 10px">
<span style="{{r.badge}}">{{r.day}}</span>
<span style="flex-grow: 1; font-size: 14px; color: #5F5B55">{{r.label}}</span>
<div style="display: flex; align-items: center; justify-content: space-between; width: 132px; height: 44px; border-radius: 12px; border: 1px solid #D4D1CB; background: #FFFFFF; overflow: hidden">
<button type="button" onClick="{{r.plus}}" aria-label="زيد" style="width: 44px; height: 44px; border: none; background: #F1F0EE; font-family: inherit; font-size: 22px; color: #111111; cursor: pointer">+</button>
<span style="font-size: 19px; font-weight: 700">{{r.qty}}</span>
<button type="button" onClick="{{r.minus}}" aria-label="نقّص" style="width: 44px; height: 44px; border: none; background: #F1F0EE; font-family: inherit; font-size: 22px; color: #111111; cursor: pointer">−</button>
</div>
</div>
</sc-for>
<button type="button" style="align-self: flex-start; height: 36px; padding: 0 12px; border-radius: 18px; border: 1px dashed #BDB9B2; background: transparent; font-family: inherit; font-size: 13px; color: #5F5B55; cursor: pointer">+ رقم ثاني</button>
</div>
</sc-for>
</div>

<div style="padding: 12px 20px 24px; border-top: 1px solid #E6E4E0; background: #FFFFFF; display: flex; flex-direction: column; gap: 8px">
<a href="FactoryHome.dc.html" style="display: flex; align-items: center; justify-content: center; height: 56px; border-radius: 14px; background: #111111; color: #FFFFFF; font-size: 18px; font-weight: 600">تأكيد جرد المصنع</a>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1100}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = {
      prods: [
        { name: 'Classic Choco', b: [[1, 2], [4, 6], [7, 6]] },
        { name: 'Flan', b: [[2, 4], [5, 3], [7, 5]] },
        { name: 'Black & White', b: [[1, 3], [7, 6]] },
        { name: 'Carrot', b: [[2, 2], [7, 4]] },
        { name: 'Strawberry', b: [[6, 1]] },
        { name: 'Tiramisu (قطع)', b: [[5, 12], [7, 24]] }
      ]
    };
  }
  bump(p, j, d) {
    const prods = this.state.prods.map((x) => ({ name: x.name, b: x.b.map((y) => y.slice()) }));
    prods[p].b[j][1] = Math.max(0, prods[p].b[j][1] + d);
    this.setState({ prods });
  }
  renderVals() {
    const colors = { 1: '#B42318', 2: '#C2410C', 3: '#A16207', 4: '#15803D', 5: '#0E7490', 6: '#1D4ED8', 7: '#7E22CE' };
    const names = { 1: 'السبت', 2: 'الأحد', 3: 'الاثنين', 4: 'الثلاثاء', 5: 'الأربعاء', 6: 'الخميس', 7: 'الجمعة (اليوم)' };
    const items = this.state.prods.map((p, pi) => ({
      name: p.name,
      total: 'المجموع: ' + p.b.reduce((s, x) => s + x[1], 0),
      rows: p.b.map((x, j) => ({
        day: x[0], qty: x[1],
        label: names[x[0]] + (x[0] === 1 ? ' · آخر يوم' : ''),
        badge: 'min-width: 32px; height: 32px; border-radius: 16px; background: ' + colors[x[0]] + '; color: #FFFFFF; font-size: 15px; font-weight: 700; display: flex; align-items: center; justify-content: center',
        plus: () => this.bump(pi, j, 1), minus: () => this.bump(pi, j, -1)
      }))
    }));
    return { items };
  }
}
</script>
</body>
</html>
