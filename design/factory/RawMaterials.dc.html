<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>المواد الأولية</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&amp;family=Jost:wght@300;400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
[dir="ltr"]{font-family:'Jost','IBM Plex Sans Arabic',sans-serif}
a{color:#111111;text-decoration:none}a:hover{color:#111111}
</style>
</helmet>
<div dir="rtl" style="width: 390px; height: 844px; box-sizing: border-box; background: #FAFAF8; font-family: 'IBM Plex Sans Arabic', system-ui, sans-serif; color: #111111; display: flex; flex-direction: column">

<div style="padding: 16px 20px 12px; display: flex; flex-direction: column; gap: 12px">
<header style="display: flex; align-items: center; gap: 8px">
<a href="FactoryHome.dc.html" aria-label="رجوع" style="width: 48px; height: 48px; border-radius: 24px; display: flex; align-items: center; justify-content: center; background: #FFFFFF; border: 1px solid #E6E4E0"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#111111" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg></a>
<h1 style="margin: 0; font-size: 22px; font-weight: 700">المواد الأولية</h1>
</header>
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
<a href="RawMove.dc.html" style="display: flex; align-items: center; justify-content: center; height: 48px; border-radius: 12px; background: #111111; color: #FFFFFF; font-size: 15px; font-weight: 600">استلام</a>
<a href="RawMove.dc.html" style="display: flex; align-items: center; justify-content: center; height: 48px; border-radius: 12px; background: #FFFFFF; border: 1.5px solid #111111; color: #111111; font-size: 15px; font-weight: 600">صرف</a>
<a href="RawMove.dc.html" style="display: flex; align-items: center; justify-content: center; height: 48px; border-radius: 12px; background: #FFFFFF; border: 1px solid #D4D1CB; font-size: 15px; font-weight: 600">جرد</a>
</div>
</div>

<div style="flex-grow: 1; overflow-y: auto; padding: 4px 20px 20px; display: flex; flex-direction: column; gap: 8px">
<sc-for list="{{items}}" as="m" hint-placeholder-count="8">
<div style="{{m.cardStyle}}">
<div style="display: flex; align-items: baseline; justify-content: space-between; gap: 8px">
<span style="font-size: 16px; font-weight: 600">{{m.name}}</span>
<span style="font-size: 18px; font-weight: 700">{{m.qtyText}}</span>
</div>
<div style="height: 6px; border-radius: 3px; background: #EEEDEA; overflow: hidden"><div style="{{m.bar}}"></div></div>
<span style="{{m.noteStyle}}">{{m.note}}</span>
</div>
</sc-for>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const data = [
      ['طحين', 38, 100, 'كيلو'], ['كريمة طبخ', 6, 20, 'لتر'], ['سكر', 120, 60, 'كيلو'], ['زبدة', 24, 15, 'كيلو'],
      ['بيض', 360, 180, 'حبة'], ['شوكولاتة داكنة', 18, 10, 'كيلو'], ['جبنة كريمية', 30, 12, 'كيلو'], ['فراولة', 12, 8, 'كيلو']
    ];
    const items = data.map((d) => {
      const low = d[1] < d[2];
      const pct = Math.min(100, Math.round(d[1] / (d[2] * 2) * 100));
      return {
        name: d[0], qtyText: d[1] + ' ' + d[3],
        cardStyle: 'display: flex; flex-direction: column; gap: 8px; padding: 12px 14px; border-radius: 14px; background: #FFFFFF; border: ' + (low ? '2px solid #E59A3A' : '1px solid #E6E4E0'),
        bar: 'height: 6px; border-radius: 3px; width: ' + pct + '%; background: ' + (low ? '#B45309' : '#2E7D4F'),
        note: low ? ('تحت الحد الأدنى (' + d[2] + ' ' + d[3] + ')') : ('الحد الأدنى ' + d[2] + ' ' + d[3]),
        noteStyle: 'font-size: 13px; ' + (low ? 'font-weight: 600; color: #7A3E06' : 'color: #5F5B55')
      };
    });
    return { items };
  }
}
</script>
</body>
</html>
