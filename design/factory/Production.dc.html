<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>تسجيل الإنتاج</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&amp;family=Jost:wght@300;400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
[dir="ltr"]{font-family:'Jost','IBM Plex Sans Arabic',sans-serif}
a{color:#111111;text-decoration:none}a:hover{color:#111111}
</style>
</helmet>
<div dir="rtl" style="width: 390px; height: 1100px; box-sizing: border-box; background: #FAFAF8; font-family: 'IBM Plex Sans Arabic', system-ui, sans-serif; color: #111111; display: flex; flex-direction: column">

<div style="padding: 16px 20px 12px; display: flex; flex-direction: column; gap: 12px; border-bottom: 1px solid #E6E4E0">
<header style="display: flex; align-items: center; gap: 8px">
<a href="FactoryHome.dc.html" aria-label="رجوع" style="width: 48px; height: 48px; border-radius: 24px; display: flex; align-items: center; justify-content: center; background: #FFFFFF; border: 1px solid #E6E4E0"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#111111" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg></a>
<h1 style="margin: 0; font-size: 22px; font-weight: 700">تسجيل الإنتاج</h1>
</header>
<div style="display: flex; align-items: center; gap: 12px; background: #F3E8FF; border-radius: 14px; padding: 12px 14px">
<span style="min-width: 44px; height: 44px; border-radius: 22px; background: #7E22CE; color: #FFFFFF; font-size: 22px; font-weight: 700; display: flex; align-items: center; justify-content: center">7</span>
<div style="display: flex; flex-direction: column">
<strong style="font-size: 16px; color: #4C1D95">إنتاج الجمعة · رقم 7</strong>
<span style="font-size: 13px; color: #5B2A86">اكتب الرقم 7 على كل كيكة من إنتاج اليوم</span>
</div>
</div>
<span style="font-size: 13px; color: #5F5B55">سجلت اليوم الساعة 7:30: 24 كيكة. اللي بتدخله هون بينضاف عليه.</span>
</div>

<div style="flex-grow: 1; overflow-y: auto; padding: 12px 20px; display: flex; flex-direction: column; gap: 8px">
<sc-for list="{{items}}" as="it" hint-placeholder-count="10">
<div style="{{it.rowStyle}}">
<span aria-hidden="true" style="width: 40px; height: 40px; border-radius: 10px; background: #ECEAE6; flex-shrink: 0"></span>
<div style="display: flex; flex-direction: column; flex-grow: 1; min-width: 0">
<span dir="ltr" style="text-align: right; font-size: 16px; font-weight: 600">{{it.name}}</span>
<span style="font-size: 12px; color: #5F5B55">{{it.unit}}</span>
</div>
<div style="display: flex; align-items: center; justify-content: space-between; width: 136px; height: 44px; border-radius: 12px; border: 1px solid #D4D1CB; background: #FFFFFF; overflow: hidden; flex-shrink: 0">
<button type="button" onClick="{{it.plus}}" aria-label="زيد" style="width: 44px; height: 44px; border: none; background: #F1F0EE; font-family: inherit; font-size: 22px; color: #111111; cursor: pointer">+</button>
<span style="font-size: 20px; font-weight: 700">{{it.qty}}</span>
<button type="button" onClick="{{it.minus}}" aria-label="نقّص" style="width: 44px; height: 44px; border: none; background: #F1F0EE; font-family: inherit; font-size: 22px; color: #111111; cursor: pointer">−</button>
</div>
</div>
</sc-for>
</div>

<div style="padding: 12px 20px 24px; border-top: 1px solid #E6E4E0; background: #FFFFFF; display: flex; flex-direction: column; gap: 8px">
<span style="font-size: 14px; color: #5F5B55; text-align: center">{{summary}}</span>
<a href="FactoryHome.dc.html" style="display: flex; align-items: center; justify-content: center; height: 56px; border-radius: 14px; background: #111111; color: #FFFFFF; font-size: 18px; font-weight: 600">حفظ الإنتاج</a>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1100}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    const names = ['Classic Choco', 'The Red One', 'The One', 'Qudrat Qader', 'Flan', 'Strawberry', 'Belgian Choco', 'Black & White', 'Classic Crunch', 'Classic Strawberry', 'Nightmare', 'Caramel Crunch', 'Latte', 'Carrot', 'Pecan', 'Double Choco', 'San Sebastian', 'Cheesecake for Two – Chocolate', 'Cheesecake for Two – Original', 'Tiramisu'];
    const start = [6, 0, 4, 0, 5, 0, 0, 6, 0, 0, 4, 0, 0, 3, 0, 0, 0, 0, 0, 24];
    this.state = { rows: names.map((n, i) => ({ name: n, qty: start[i], piece: i >= 17 })) };
  }
  bump(i, d) {
    const rows = this.state.rows.slice();
    rows[i] = Object.assign({}, rows[i], { qty: Math.max(0, rows[i].qty + d) });
    this.setState({ rows });
  }
  renderVals() {
    const rows = this.state.rows;
    const items = rows.map((r, i) => ({
      name: r.name, qty: r.qty, unit: r.piece ? 'قطع' : 'كيكات',
      rowStyle: 'display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 14px; background: #FFFFFF; border: ' + (r.qty > 0 ? '2px solid #111111' : '1px solid #E6E4E0'),
      plus: () => this.bump(i, 1), minus: () => this.bump(i, -1)
    }));
    const cakes = rows.filter((r) => !r.piece).reduce((s, r) => s + r.qty, 0);
    const pcs = rows.filter((r) => r.piece).reduce((s, r) => s + r.qty, 0);
    return { items, summary: rows.filter((r) => r.qty > 0).length + ' أصناف · ' + cakes + ' كيكة · ' + pcs + ' قطعة · كلها رقم 7' };
  }
}
</script>
</body>
</html>
