<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>طلب من المصنع</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&amp;family=Jost:wght@300;400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
[dir="ltr"]{font-family:'Jost','IBM Plex Sans Arabic',sans-serif}
a{color:#111111;text-decoration:none}a:hover{color:#111111}
</style>
</helmet>
<div dir="rtl" style="width: 390px; height: 1100px; box-sizing: border-box; background: #FAFAF8; font-family: 'IBM Plex Sans Arabic', system-ui, sans-serif; color: #111111; display: flex; flex-direction: column; position: relative">

<div style="padding: 16px 20px 12px; display: flex; flex-direction: column; gap: 12px; border-bottom: 1px solid #E6E4E0">
<header style="display: flex; align-items: center; gap: 8px">
<a href="Main.dc.html" aria-label="رجوع" style="width: 48px; height: 48px; border-radius: 24px; display: flex; align-items: center; justify-content: center; background: #FFFFFF; border: 1px solid #E6E4E0"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#111111" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg></a>
<div style="display: flex; flex-direction: column">
<h1 style="margin: 0; font-size: 22px; font-weight: 700">طلب من المصنع</h1>
<span style="font-size: 14px; color: #5F5B55">الكميات مقترحة حسب الحد المطلوب، عدّلها براحتك</span>
</div>
</header>
<label for="search" style="display: flex; align-items: center; gap: 8px; height: 48px; padding: 0 14px; border-radius: 12px; border: 1px solid #D4D1CB; background: #FFFFFF">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#5F5B55" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-4-4"></path></svg>
<input id="search" type="search" placeholder="دوّر على صنف" style="border: none; outline: none; background: transparent; font-family: inherit; font-size: 16px; flex-grow: 1; color: #111111">
</label>
</div>

<div style="flex-grow: 1; overflow-y: auto; padding: 12px 20px; display: flex; flex-direction: column; gap: 10px">
<sc-for list="{{items}}" as="it" hint-placeholder-count="8">
<div style="{{it.cardStyle}}">
<div style="display: flex; align-items: center; gap: 12px">
<span aria-hidden="true" style="width: 44px; height: 44px; border-radius: 10px; background: #ECEAE6; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#A8A39B" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h16v-6H4z"></path><path d="M4 14c0-2 2-4 8-4s8 2 8 4"></path><path d="M12 10V6"></path></svg></span>
<div style="display: flex; flex-direction: column; flex-grow: 1">
<span dir="ltr" style="text-align: right; font-size: 17px; font-weight: 600">{{it.name}}</span>
<span style="font-size: 13px; color: #5F5B55">{{it.stock}}</span>
</div>
</div>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
<sc-if value="{{it.hasWhole}}" hint-placeholder-val="{{ true }}">
<div style="display: flex; flex-direction: column; gap: 4px">
<span style="font-size: 13px; color: #5F5B55">كيكات</span>
<div style="display: flex; align-items: center; justify-content: space-between; height: 48px; border-radius: 12px; border: 1px solid #D4D1CB; background: #FFFFFF; overflow: hidden">
<button type="button" onClick="{{it.wholePlus}}" aria-label="زيد كيكة" style="width: 48px; height: 48px; border: none; background: #F1F0EE; font-family: inherit; font-size: 24px; color: #111111; cursor: pointer">+</button>
<span style="font-size: 22px; font-weight: 700">{{it.whole}}</span>
<button type="button" onClick="{{it.wholeMinus}}" aria-label="نقّص كيكة" style="width: 48px; height: 48px; border: none; background: #F1F0EE; font-family: inherit; font-size: 24px; color: #111111; cursor: pointer">−</button>
</div>
</div>
</sc-if>
<sc-if value="{{it.sliceOnly}}" hint-placeholder-val="{{ false }}">
<div style="display: flex; flex-direction: column; gap: 4px">
<span style="font-size: 13px; color: #5F5B55">كيكات</span>
<div style="height: 48px; border-radius: 12px; background: #F1F0EE; display: flex; align-items: center; justify-content: center; font-size: 13px; color: #5F5B55">قطع بس</div>
</div>
</sc-if>
<div style="display: flex; flex-direction: column; gap: 4px">
<span style="font-size: 13px; color: #5F5B55">قطع</span>
<div style="display: flex; align-items: center; justify-content: space-between; height: 48px; border-radius: 12px; border: 1px solid #D4D1CB; background: #FFFFFF; overflow: hidden">
<button type="button" onClick="{{it.slicePlus}}" aria-label="زيد قطعة" style="width: 48px; height: 48px; border: none; background: #F1F0EE; font-family: inherit; font-size: 24px; color: #111111; cursor: pointer">+</button>
<span style="font-size: 22px; font-weight: 700">{{it.slice}}</span>
<button type="button" onClick="{{it.sliceMinus}}" aria-label="نقّص قطعة" style="width: 48px; height: 48px; border: none; background: #F1F0EE; font-family: inherit; font-size: 24px; color: #111111; cursor: pointer">−</button>
</div>
</div>
</div>
</div>
</sc-for>
</div>

<div style="padding: 12px 20px 24px; border-top: 1px solid #E6E4E0; background: #FFFFFF; display: flex; flex-direction: column; gap: 8px">
<span style="font-size: 14px; color: #5F5B55; text-align: center">{{summary}}</span>
<button type="button" onClick="{{openReview}}" style="height: 56px; border-radius: 14px; border: none; background: #111111; color: #FFFFFF; font-family: inherit; font-size: 18px; font-weight: 600; cursor: pointer">مراجعة الطلب</button>
</div>

<sc-if value="{{review}}" hint-placeholder-val="{{ false }}">
<div style="position: absolute; inset: 0; background: rgba(17,17,17,0.45); display: flex; flex-direction: column; justify-content: flex-end">
<div role="dialog" aria-label="مراجعة الطلب" style="background: #FAFAF8; border-radius: 24px 24px 0 0; padding: 20px 20px 24px; display: flex; flex-direction: column; gap: 14px">
<div style="align-self: center; width: 40px; height: 4px; border-radius: 2px; background: #D4D1CB"></div>
<h2 style="margin: 0; font-size: 20px; font-weight: 700">راجع طلبك قبل الإرسال</h2>
<div style="display: flex; flex-direction: column; background: #FFFFFF; border: 1px solid #E6E4E0; border-radius: 14px">
<sc-for list="{{picked}}" as="p" hint-placeholder-count="3">
<div style="display: flex; justify-content: space-between; align-items: center; padding: 12px 14px; border-bottom: 1px solid #EFEDE9">
<span dir="ltr" style="font-size: 16px; font-weight: 600">{{p.name}}</span>
<span style="font-size: 15px; color: #5F5B55">{{p.qty}}</span>
</div>
</sc-for>
</div>
<sc-if value="{{nonePicked}}" hint-placeholder-val="{{ false }}"><span style="font-size: 15px; color: #B42318">ما اخترت ولا صنف لسا</span></sc-if>
<a href="Orders.dc.html" style="display: flex; align-items: center; justify-content: center; height: 56px; border-radius: 14px; background: #111111; color: #FFFFFF; font-size: 18px; font-weight: 600">إرسال الطلب للمصنع</a>
<button type="button" onClick="{{closeReview}}" style="height: 48px; border-radius: 14px; border: 1px solid #D4D1CB; background: #FFFFFF; font-family: inherit; font-size: 16px; color: #111111; cursor: pointer">رجوع للتعديل</button>
</div>
</div>
</sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1100}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    const base = [
      ['Classic Choco', 1, 3, 2], ['The Red One', 0, 2, 7], ['The One', 2, 0, 5], ['Qudrat Qader', 0, 3, 0],
      ['Flan', 0, 1, 9], ['Strawberry', 1, 2, 4], ['Belgian Choco', 0, 0, 11], ['Black & White', 0, 5, 3],
      ['Classic Crunch', 0, 1, 6], ['Classic Strawberry', 0, 2, 0], ['Nightmare', 1, 0, 8], ['Caramel Crunch', 0, 3, 2],
      ['Latte', 0, 1, 1], ['Carrot', 0, 2, 5], ['Pecan', 1, 1, 0], ['Double Choco', 0, 4, 6], ['San Sebastian', 0, 2, 3],
      ['Cheesecake for Two – Chocolate', 0, 0, 4, true], ['Cheesecake for Two – Original', 0, 0, 3, true], ['Tiramisu', 0, 0, 7, true]
    ];
    this.state = { review: false, rows: base.map((b, i) => { const par = b[4] ? 0 : 20; const hw = b[4] ? 0 : 13 + (i * 5) % 9; return { name: b[0], whole: Math.max(0, par - hw), slice: 0, haveW: hw, haveS: b[3], sliceOnly: !!b[4], par }; }) };
  }
  bump(i, key, d) {
    const rows = this.state.rows.slice();
    const r = Object.assign({}, rows[i]);
    r[key] = Math.max(0, r[key] + d);
    rows[i] = r;
    this.setState({ rows });
  }
  renderVals() {
    const rows = this.state.rows;
    const items = rows.map((r, i) => ({
      name: r.name, whole: r.whole, slice: r.slice, sliceOnly: r.sliceOnly, hasWhole: !r.sliceOnly,
      stock: r.sliceOnly ? ('عندك: ' + r.haveS + ' قطعة') : ('عندك ' + r.haveW + ' كيكة و' + r.haveS + ' قطعة · الحد ' + r.par),
      cardStyle: 'display: flex; flex-direction: column; gap: 10px; padding: 12px; border-radius: 16px; background: #FFFFFF; border: ' + ((r.whole + r.slice) > 0 ? '2px solid #111111' : '1px solid #E6E4E0'),
      wholePlus: () => this.bump(i, 'whole', 1), wholeMinus: () => this.bump(i, 'whole', -1),
      slicePlus: () => this.bump(i, 'slice', 1), sliceMinus: () => this.bump(i, 'slice', -1)
    }));
    const pickedRows = rows.filter((r) => r.whole + r.slice > 0);
    const picked = pickedRows.map((r) => {
      const parts = [];
      if (r.whole) parts.push(r.whole + ' كيكة');
      if (r.slice) parts.push(r.slice + ' قطعة');
      return { name: r.name, qty: parts.join(' + ') };
    });
    const w = rows.reduce((s, r) => s + r.whole, 0);
    const s = rows.reduce((t, r) => t + r.slice, 0);
    return {
      items, picked, nonePicked: picked.length === 0, review: this.state.review,
      summary: pickedRows.length + ' صنف · ' + w + ' كيكة · ' + s + ' قطعة',
      openReview: () => this.setState({ review: true }),
      closeReview: () => this.setState({ review: false })
    };
  }
}
</script>
</body>
</html>
