<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>تسجيل تالف</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&amp;family=Jost:wght@300;400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
[dir="ltr"]{font-family:'Jost','IBM Plex Sans Arabic',sans-serif}
a{color:#111111;text-decoration:none}a:hover{color:#111111}
</style>
</helmet>
<div dir="rtl" style="width: 390px; height: 844px; box-sizing: border-box; background: #FAFAF8; font-family: 'IBM Plex Sans Arabic', system-ui, sans-serif; color: #111111; display: flex; flex-direction: column; padding: 16px 20px 24px; gap: 20px">

<header style="display: flex; align-items: center; gap: 8px">
<a href="Main.dc.html" aria-label="رجوع" style="width: 48px; height: 48px; border-radius: 24px; display: flex; align-items: center; justify-content: center; background: #FFFFFF; border: 1px solid #E6E4E0"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#111111" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg></a>
<h1 style="margin: 0; font-size: 22px; font-weight: 700">تسجيل تالف</h1>
</header>

<div style="display: flex; flex-direction: column; gap: 8px">
<span style="font-size: 15px; font-weight: 600">الصنف</span>
<button type="button" style="display: flex; align-items: center; gap: 12px; height: 64px; padding: 0 14px; border-radius: 14px; border: 1px solid #D4D1CB; background: #FFFFFF; font-family: inherit; cursor: pointer; text-align: right">
<span aria-hidden="true" style="width: 44px; height: 44px; border-radius: 10px; background: #ECEAE6; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#A8A39B" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h16v-6H4z"></path><path d="M4 14c0-2 2-4 8-4s8 2 8 4"></path><path d="M12 10V6"></path></svg></span>
<span dir="ltr" style="flex-grow: 1; text-align: right; font-size: 17px; font-weight: 600; color: #111111">Flan</span>
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#5F5B55" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg>
</button>
</div>

<div style="display: flex; flex-direction: column; gap: 8px">
<span style="font-size: 15px; font-weight: 600">الكمية</span>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0; height: 48px; border-radius: 12px; background: #EEEDEA; padding: 4px; box-sizing: border-box">
<button type="button" onClick="{{pickWhole}}" style="{{wholeTab}}">كيكة كاملة</button>
<button type="button" onClick="{{pickSlice}}" style="{{sliceTab}}">قطعة</button>
</div>
<div style="display: flex; align-items: center; justify-content: space-between; height: 64px; border-radius: 14px; border: 1px solid #D4D1CB; background: #FFFFFF; overflow: hidden">
<button type="button" onClick="{{plus}}" aria-label="زيد" style="width: 64px; height: 64px; border: none; background: #F1F0EE; font-family: inherit; font-size: 28px; color: #111111; cursor: pointer">+</button>
<span style="font-size: 28px; font-weight: 700">{{qty}}</span>
<button type="button" onClick="{{minus}}" aria-label="نقّص" style="width: 64px; height: 64px; border: none; background: #F1F0EE; font-family: inherit; font-size: 28px; color: #111111; cursor: pointer">−</button>
</div>
</div>

<div style="display: flex; flex-direction: column; gap: 8px">
<span style="font-size: 15px; font-weight: 600">السبب</span>
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
<sc-for list="{{reasons}}" as="r" hint-placeholder-count="3">
<button type="button" onClick="{{r.pick}}" style="{{r.style}}">{{r.label}}</button>
</sc-for>
</div>
</div>

<button type="button" style="display: flex; align-items: center; justify-content: center; gap: 10px; height: 64px; border-radius: 14px; border: 1.5px dashed #BDB9B2; background: transparent; font-family: inherit; font-size: 16px; color: #5F5B55; cursor: pointer">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#5F5B55" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z"></path><circle cx="12" cy="13" r="4"></circle></svg>
أضف صورة (اختياري)
</button>

<div style="flex-grow: 1"></div>
<a href="Main.dc.html" style="display: flex; align-items: center; justify-content: center; height: 56px; border-radius: 14px; background: #111111; color: #FFFFFF; font-size: 18px; font-weight: 600">{{submitText}}</a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { unit: 'whole', qty: 1, reason: 'انتهت' }; }
  renderVals() {
    const st = this.state;
    const on = 'border: none; border-radius: 9px; background: #FFFFFF; font-family: inherit; font-size: 15px; font-weight: 600; color: #111111; cursor: pointer; box-shadow: 0 1px 2px rgba(17,17,17,0.12)';
    const off = 'border: none; border-radius: 9px; background: transparent; font-family: inherit; font-size: 15px; color: #5F5B55; cursor: pointer';
    const reasons = ['انتهت', 'انكسرت', 'غيره'].map((l) => ({
      label: l,
      pick: () => this.setState({ reason: l }),
      style: 'height: 52px; border-radius: 12px; font-family: inherit; font-size: 16px; cursor: pointer; ' + (st.reason === l ? 'border: 2px solid #111111; background: #F1F0EE; color: #111111; font-weight: 600' : 'border: 1px solid #D4D1CB; background: #FFFFFF; color: #111111')
    }));
    const unitWord = st.unit === 'whole' ? (st.qty === 1 ? 'كيكة' : 'كيكات') : (st.qty === 1 ? 'قطعة' : 'قطع');
    return {
      qty: st.qty, reasons,
      wholeTab: st.unit === 'whole' ? on : off,
      sliceTab: st.unit === 'slice' ? on : off,
      pickWhole: () => this.setState({ unit: 'whole' }),
      pickSlice: () => this.setState({ unit: 'slice' }),
      plus: () => this.setState({ qty: st.qty + 1 }),
      minus: () => this.setState({ qty: Math.max(1, st.qty - 1) }),
      submitText: 'سجّل ' + st.qty + ' ' + unitWord + ' تالف'
    };
  }
}
</script>
</body>
</html>
